name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend · ruff · mypy · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
          POSTGRES_DB: brokerhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U broker -d brokerhub"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://broker:broker@localhost:5432/brokerhub
      DATABASE_URL_TEST: postgresql+asyncpg://broker:broker@localhost:5432/brokerhub_test
      REDIS_URL: redis://localhost:6379/0
      INTEGRATIONS_DRIVER: sim
      CELERY_TASK_ALWAYS_EAGER: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: mypy (strict)
        run: mypy app
      - name: Test database
        run: psql "postgresql://broker:broker@localhost:5432/postgres" -c "CREATE DATABASE brokerhub_test;" || true
      - name: pytest + coverage
        run: |
          coverage run -m pytest -q
          coverage xml -o coverage.xml
          coverage report --skip-covered
      - name: Core coverage gate (spec §10)
        run: python scripts/check_core_coverage.py
      - name: Dependency audit
        run: pip-audit --strict -r requirements.txt
      - name: OpenAPI export must be committed (compared as data, not text)
        run: python scripts/check_openapi_fresh.py
  frontend:
    name: frontend · lint · typecheck · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types are generated, never handwritten
        run: |
          npm run codegen:api
          git diff --exit-code src/lib/api/schema.d.ts || {
            echo "::error::src/lib/api/schema.d.ts is stale — run: (cd frontend && npm run codegen:api)"; exit 1; }
      - name: ESLint (warnings are errors)
        run: npm run lint
      - name: TypeScript (app + e2e)
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: e2e · playwright · screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      INTEGRATIONS_DRIVER: sim
      CELERY_TASK_ALWAYS_EAGER: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend (the e2e webServer boots the API + seed itself)
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run codegen:api
      - name: Playwright (1440×900 and 390×844)
        # E2E_USE_PREVIEW=1: the webServer builds the bundle and serves it with `vite preview`, so the
        # suite never waits on Vite's first-request transforms (that cold start failed the first 9
        # desktop tests in an earlier run). The proxy for /api and /media is configured for preview too.
        run: |
          npx playwright install --with-deps chromium
          E2E_USE_PREVIEW=1 npm run e2e
      - name: Screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          retention-days: 30
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: docker · compose config · image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Build backend image
        run: docker build -f infra/backend.Dockerfile -t broker-hub-backend:ci .
      - name: Build frontend image
        run: docker build -f infra/frontend.Dockerfile -t broker-hub-frontend:ci .
      - name: Smoke the backend image
        run: |
          docker run --rm -e DATABASE_URL="sqlite+aiosqlite:////tmp/t.db" broker-hub-backend:ci \
            python -c "import app.main; print('import-ok', app.main.app.title)"
